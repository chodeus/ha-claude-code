# From chodeus-ops templates/caller-image-refresh.yml. Weekly rather than daily: every release
# restarts the add-on, and the dispatched workflow cuts a new version because HA only updates on one.

name: Image refresh

on:
  schedule:
    - cron: '23 18 * * 0'   # Sunday 18:23 UTC (Monday 02:23 Perth), off the hour
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    # The called workflow can only reduce what this job grants: the pull needs
    # packages: read and the dispatch needs actions: write.
    permissions:
      packages: read
      actions: write
    # Pin to an immutable SHA, not @main: a commit to chodeus-ops main would
    # otherwise run in every consumer repo with its GITHUB_TOKEN (actions: write).
    uses: chodeus/chodeus-ops/.github/workflows/image-refresh.yml@cbd544d21103cfe854c8e0ec717ee2be4f097ad7 # main
    with:
      image: ghcr.io/chodeus/claudecode-amd64:latest
      workflow: refresh-release.yml
      ref: ${{ github.event.repository.default_branch }}
    # Posts the package changes, or a failure; a clean check posts nothing.
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
